name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'apps/desktop/index.html', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'apps/desktop/index.html', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Check that the website mirrors app Help
        run: npm run check:help
      - name: Build and verify local links
        run: npm run build
      - name: Audit website dependencies
        run: npm audit --audit-level=moderate
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check desktop, mobile, and accessibility
        run: npm test
