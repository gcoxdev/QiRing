<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">QiRing Q keyhole mark with vintage key teeth</title>
  <rect width="128" height="128" rx="22" fill="#0a0e0d"/>
  <g fill="#9df7c7">
    <!-- Q ring (key bow) -->
    <circle cx="57" cy="55" r="26" fill="none" stroke="#9df7c7" stroke-width="10" stroke-linecap="round"/>
    <!-- Q tail as a vintage skeleton-key shaft + bit, filled solid, exiting bottom-right of the ring -->
    <path d="
      M73 70.5
      L101 98.5
      L101 107.5
      L92 107.5
      L92 100.5
      L85 100.5
      L85 93.5
      L78 93.5
      L78 86.5
      L70 78.5
      Z"
      stroke="#9df7c7" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- keyhole: round top -->
    <circle cx="57" cy="51.5" r="7.6" stroke="none"/>
    <!-- keyhole: wedge -->
    <path d="m52.6 57-3.3 20.5h15.4L61.4 57Z" stroke="none"/>
  </g>
  <path d="M50 37.5c4.5-2.4 9.5-2.4 14 0" fill="none" stroke="#eef6f1" stroke-width="4.5" stroke-linecap="round"/>
</svg>
